name: build_debian_package
run-name: ${{ github.actor }} is packaging for Debian
# On pull requests and on main, where it also publishes the package.
on:
  pull_request:
  push:
    branches: [main]

env:
  REPO_NAME: openhexa
  CODENAME: bookworm
  COMPONENTS: main
  ARCHITECTURES: amd64

jobs:
  package:
    name: Build Debian package
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - name: Update APT database
        run: apt update

      - name: Obtain Latest Git ONLY within container for checkout
        run: apt install -y --no-install-recommends git ca-certificates

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Make the working directory safe for Git if run in GitHub runner container
        run: git config --system --add safe.directory "$PWD"

      - name: Hack container for local development
        if: ${{ env.ACT }}
        run: |
          apt install -y --no-install-recommends curl
          curl -fsSL https://deb.nodesource.com/setup_18.x | su -p -c bash -
          apt install -y nodejs

      - name: Install devscripts
        run: apt install -y --no-install-recommends devscripts debhelper build-essential

      - name: Build package
        run: |
          ./script/build.sh
          cp ../openhexa_*_amd64.deb .

      - name: Keep package
        uses: actions/upload-artifact@v7
        with:
          name: debian_package_amd64
          path: openhexa_*_amd64.deb

  # Installs the package and runs the openhexa-app e2e suite against it, on
  # two throwaway runners: one upgrades the released package to the new one,
  # the other installs the new one on a clean machine.
  e2e:
    name: E2E suite (${{ matrix.scenario }})
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scenario: [upgrade, fresh]
    env:
      # Published through NGINX as README.md describes. Any name under
      # .localhost is the machine itself, so it needs no DNS.
      E2E_HOSTNAME: openhexa.localhost
      E2E_BASE_URL: http://openhexa.localhost
      # Created by e2e/seed.py, then looked for by the suite
      E2E_EMAIL: e2e@example.org
      E2E_ORGANIZATION_NAME: E2E Testing
      E2E_ORGANIZATION_SHORT_NAME: E2E
      E2E_WORKSPACE_NAME: E2E Workspace
      # What a packaged install does not have, see openhexa-app/e2e/README.md
      E2E_SERVER_CONFIGURATION_AI_ENABLED: "false"
      E2E_SERVER_CONFIGURATION_SELF_REGISTRATION_ENABLED: "false"
      E2E_SERVER_CONFIGURATION_SUBSCRIPTION_CONSOLE_ENABLED: "false"
      # Branches of openhexa-app to take the suite from while no release has
      # it yet, in order of preference.
      E2E_FALLBACK_REFS: main chore-e2e-capabilities

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Retrieve package
        uses: actions/download-artifact@v8
        with:
          name: debian_package_amd64

      - name: Install OpenHexa dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends curl ca-certificates gettext-base openssl postgresql postgresql-postgis nginx
          curl -fsSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /tmp/yq &&\
              sudo mv /tmp/yq /usr/bin/yq &&\
              sudo chmod +x /usr/bin/yq
          sudo systemctl restart postgresql

      # The way a new user installs it: from the signed public APT repo.
      - name: Install the released OpenHexa
        if: matrix.scenario == 'upgrade'
        run: |
          sudo gpg --yes --dearmor --output /usr/share/keyrings/openhexa.gpg < pubkey.gpg
          echo "deb [signed-by=/usr/share/keyrings/openhexa.gpg] https://viz.bluesquare.org/openhexa/ ${CODENAME} ${COMPONENTS}" | sudo tee /etc/apt/sources.list.d/openhexa.list
          sudo apt update
          sudo apt install -y --no-install-recommends openhexa
          dpkg-query -W openhexa

      - name: Install the new OpenHexa
        if: matrix.scenario == 'fresh'
        run: sudo dpkg -i openhexa_*_amd64.deb

      - name: Check OpenHexa installation
        run: |
          sudo systemctl status openhexa.service
          /usr/share/openhexa/setup.sh -g check

      # What README.md asks of an install: the workspaces' databases reached
      # at the address of the server (here the one Docker gives it), a mail
      # server (here one that keeps the mail it is given), and NGINX in front,
      # with a domain for the web apps.
      - name: Configure OpenHexa
        run: |
          set -euo pipefail
          docker run -d --name mailpit --network openhexa --restart unless-stopped axllent/mailpit:v1.20
          HOST=$(docker network inspect --format='{{(index .IPAM.Config 0).Gateway}}' bridge)
          sudo sed -i \
            -e "s|^OVERRIDE_WORKSPACES_DATABASE_HOST=.*|OVERRIDE_WORKSPACES_DATABASE_HOST=${HOST}|" \
            -e "s|^EMAIL_HOST=.*|EMAIL_HOST=mailpit|" \
            -e "s|^EMAIL_PORT=.*|EMAIL_PORT=1025|" \
            -e "s|^DEFAULT_FROM_EMAIL=.*|DEFAULT_FROM_EMAIL=openhexa@example.org|" \
            -e "s|^WEBAPPS_DOMAIN=.*|WEBAPPS_DOMAIN=webapps.${E2E_HOSTNAME}|" \
            /etc/openhexa/env.conf
          printf '%s\n' 'TRUST_FORWARDED_PROTO="false"' "PROXY_HOSTNAME_AND_PORT=${E2E_HOSTNAME}" | sudo tee -a /etc/openhexa/env.conf
          sudo grep -E '^(OVERRIDE_WORKSPACES_DATABASE_HOST|EMAIL_HOST|EMAIL_PORT|DEFAULT_FROM_EMAIL|WEBAPPS_DOMAIN)=' /etc/openhexa/env.conf

          sed "s/example\.com/${E2E_HOSTNAME}/g" nginx/openhexa.conf | sudo tee /etc/nginx/sites-available/openhexa > /dev/null
          sudo ln -s /etc/nginx/sites-available/openhexa /etc/nginx/sites-enabled/
          sudo nginx -t

          sudo systemctl restart openhexa nginx

      - name: Get OpenHexa status
        run: |
          /usr/share/openhexa/openhexa.sh -g status
          getent hosts "${E2E_HOSTNAME}" "e2e.webapps.${E2E_HOSTNAME}" || true
          curl -fsS -o /dev/null -w "NGINX answers %{http_code} at %{url_effective}\n" "${E2E_BASE_URL}/login"

      # The suite is taken at the version of the app being packaged, so that it
      # matches the app under test. A release from before the suite could run
      # on a packaged install falls back to a branch.
      - name: Pick the version of the e2e suite
        id: suite
        run: |
          set -euo pipefail
          APP_VERSION=$(yq '.x-app.image' compose.yml | cut -d: -f2)
          for ref in "$APP_VERSION" $E2E_FALLBACK_REFS; do
            if curl -fsSIo /dev/null "https://raw.githubusercontent.com/BLSQ/openhexa-app/${ref}/e2e/seed/seed-tables.sql"; then
              echo "ref=${ref}" >> "$GITHUB_OUTPUT"
              echo "E2E suite from openhexa-app at \`${ref}\` (app ${APP_VERSION})." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::error::no e2e suite with its sample tables at ${APP_VERSION} ${E2E_FALLBACK_REFS}"
          exit 1

      - name: Checkout the e2e suite
        uses: actions/checkout@v7
        with:
          repository: BLSQ/openhexa-app
          ref: ${{ steps.suite.outputs.ref }}
          path: openhexa-app
          sparse-checkout: e2e
          persist-credentials: false

      # Creates the account the suite signs in as, the organization and the
      # workspace it works in, then loads the tables it reads.
      - name: Seed the test data
        run: |
          set -euo pipefail
          E2E_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::${E2E_PASSWORD}"
          echo "E2E_PASSWORD=${E2E_PASSWORD}" >> "$GITHUB_ENV"
          export E2E_PASSWORD
          SEEDED=$(docker exec -i -e E2E_EMAIL -e E2E_PASSWORD -e E2E_ORGANIZATION_NAME \
            -e E2E_ORGANIZATION_SHORT_NAME -e E2E_WORKSPACE_NAME \
            app python manage.py shell < e2e/seed.py)
          # Where the suite finds what was created
          printf '%s\n' "$SEEDED" | grep -E '^E2E_(ORGANIZATION_ID|WORKSPACE_SLUG)=' | tee -a "$GITHUB_ENV"
          # The URL is the one the containers use: from here it is on localhost.
          DB_URL=$(printf '%s\n' "$SEEDED" | sed -n 's/^WORKSPACE_DATABASE_URL=//p' | sed -E 's#@[^:/]+:#@localhost:#')
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f openhexa-app/e2e/seed/seed-tables.sql

      # The procedure of UPGRADING.md, with the package built by this run.
      - name: Upgrade to the new OpenHexa
        if: matrix.scenario == 'upgrade'
        run: |
          set -euo pipefail
          sudo systemctl stop openhexa
          sudo dpkg -i openhexa_*_amd64.deb
          sudo /usr/share/openhexa/openhexa.sh -g update
          sudo /usr/share/openhexa/openhexa.sh -g prepare
          sudo systemctl start openhexa
          dpkg-query -W openhexa
          # Two sets of images now share the runner's disk.
          df -h /

      - name: Get OpenHexa status after the upgrade
        if: matrix.scenario == 'upgrade'
        run: /usr/share/openhexa/openhexa.sh -g status

      - name: Use Node.js v22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: openhexa-app/e2e/package-lock.json

      - name: Install the e2e suite
        working-directory: openhexa-app/e2e
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      # Unlike in openhexa-app, the report and the traces are kept: the only
      # password they hold is the one of an install that ends with this job.
      # e2e/excluded-tests.txt lists what is left out, and why.
      - name: Run the e2e suite
        working-directory: openhexa-app/e2e
        env:
          CI: true
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          EXCLUDED=$(grep -vE '^(#|$)' "$GITHUB_WORKSPACE/e2e/excluded-tests.txt" | paste -sd '|')
          npx playwright test \
            --grep-invert "$EXCLUDED" \
            --reporter=github,list,html \
            --trace retain-on-failure

      - name: Keep the e2e report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: E2E report (${{ matrix.scenario }})
          path: |
            openhexa-app/e2e/playwright-report/
            openhexa-app/e2e/test-results/
          if-no-files-found: ignore

      - name: Keep OpenHexa logs
        if: failure()
        run: sudo /usr/share/openhexa/openhexa.sh -g logs > openhexa.log 2>&1 || true

      - name: Upload OpenHexa logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: OpenHexa logs (${{ matrix.scenario }})
          path: openhexa.log
          if-no-files-found: ignore

      - name: Remove and purge package
        if: matrix.scenario == 'fresh'
        run: |
          /usr/share/openhexa/openhexa.sh -g stop
          sudo apt purge -y openhexa

  create_apt_repo:
    name: Create APT repo
    needs: e2e
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload-artifact.outputs.artifact-id }}
      keyring: ${{ steps.create-apt-repo.outputs.keyring }}
    steps:
      - name: Retrieve package
        if: ${{ ! env.ACT }}
        uses: actions/download-artifact@v8
        with:
          name: debian_package_amd64
      - uses: morph027/apt-repo-action@main
        if: ${{ ! env.ACT }}
        id: create-apt-repo
        with:
          repo-name: ${{ env.REPO_NAME }}
          signing-key: ${{ secrets.GPG_OPENHEXA_PRIVATE_KEY }}
          codename: ${{ env.CODENAME }}
          components: ${{ env.COMPONENTS }}
          architectures: ${{ env.ARCHITECTURES }}
      - name: Upload Pages artifact
        if: ${{ ! env.ACT }}
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: ${{ steps.create-apt-repo.outputs.dir }}
  deploy_apt_repo:
    name: Publish apt repo with GitHub Pages
    permissions:
      id-token: write
      pages: write
    if: github.ref_name == 'main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: create_apt_repo
    steps:
      - name: Deploy to GitHub Pages
        if: ${{ ! env.ACT }}
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Adding summary
        if: ${{ ! env.ACT }}
        run: |
          echo ':rocket:' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo 'curl -sfLo /etc/apt.trusted.gpg.d/${{ needs.build.outputs.keyring }}.asc ${{ steps.deploy-pages.outputs.page_url }}gpg.key' >> $GITHUB_STEP_SUMMARY
          echo 'echo "deb ${{ steps.deploy-pages.outputs.page_url }} ${{ env.CODENAME }} ${{ env.COMPONENTS }}" >/etc/apt/sources.list.d/${{ env.REPO_NAME }}.list' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # Tags the commit and publishes a GitHub release with the .deb attached, once
  # per package version: pushes to main that don't bump debian/changelog find
  # the release already there and skip.
  release:
    name: Create GitHub release
    permissions:
      contents: write
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    needs: deploy_apt_repo
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Retrieve package
        if: ${{ ! env.ACT }}
        uses: actions/download-artifact@v8
        with:
          name: debian_package_amd64

      - name: Create release for the packaged version
        if: ${{ ! env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # First changelog line looks like: openhexa (5.22.2-1) stable; urgency=high
          VERSION=$(sed -n '1s/^[^(]*(\([^)]*\)).*$/\1/p' debian/changelog)
          if [ -z "$VERSION" ]; then
            echo "::error::could not read the package version from debian/changelog"
            exit 1
          fi

          # Git refs can't hold ':' or '~', which Debian versions may (DEP-14 mapping).
          TAG="$(printf '%s' "$VERSION" | tr ':~' '%_')"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Release notes: the body of the top changelog stanza, without its
          # header and its " -- maintainer  date" trailer.
          awk 'NR == 1 { next } /^ -- / { exit } { print }' debian/changelog \
            | sed 's/^  //' > "$RUNNER_TEMP/release-notes.md"

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            openhexa_*_amd64.deb

          echo "Published release $TAG." >> "$GITHUB_STEP_SUMMARY"
