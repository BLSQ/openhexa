# NGINX site publishing OpenHexa over HTTP, see "Publish OpenHexa through a NGINX
# proxy" in README.md. Replace example.com with your domain name.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name example.com;

    # Files are uploaded through here: as much as MAX_REQUEST_BODY_SIZE allows
    # in /etc/openhexa/env.conf, instead of the 1 MB NGINX stops at by default.
    client_max_body_size 5g;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The account page is OpenHexa's, the rest of /user is JupyterHub's.
    # Matched exactly and as a directory: a plain /user/account prefix would also
    # take the notebooks of users whose email starts with "account".
    location = /user/account {
        proxy_pass http://localhost:3000;
    }

    location ^~ /user/account/ {
        proxy_pass http://localhost:3000;
    }

    location ~ ^/(?<root_path>hub|user)(?<path>/.*)? {
        rewrite ^ /$root_path$path break;
        proxy_pass http://localhost:8001;

        # websocket headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Scheme $scheme;

        proxy_buffering off;
    }

    # Static Webapps auth-token endpoint is served by the backend (app),
    # not the frontend, so route it directly to the backend port.
    location /webapps/ {
        proxy_pass http://localhost:8000;
    }


    location / {
        proxy_pass http://localhost:3000;
    }

}

# Support for webapps wildcard host:
# Route all *.webapps.example.com subdomains (e.g. my-app.webapps.example.com) to the backend on port 8000.
server {
    listen 80;
    client_max_body_size 500M;
    server_name *.webapps.example.com;

    location / {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
